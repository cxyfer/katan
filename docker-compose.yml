# Runs the published image (ghcr.io/cxyfer/katan). To build from this checkout,
# add docker-compose.build.yml (see docs/OPERATIONS.md).
services:
  katan:
    image: ghcr.io/cxyfer/katan:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      SQLITE_PATH: /data/katan.sqlite
      # 0.4.x 以前的資料庫；/data 沒有 katan.sqlite 時會從這裡複製一份
      LEGACY_SQLITE_PATH: /data-legacy/catan.sqlite
      WEB_DIST_PATH: /app/web
      COOKIE_SECURE: "false" # set to true behind TLS
      LOG_LEVEL: info
      DEFAULT_DISCONNECT_GRACE_SECONDS: "300"
      DEFAULT_TURN_CLOCK_SECONDS: "0"
    volumes:
      - katan-data:/data
      # 0.4.x 以前的 volume，唯讀掛載只供首次啟動複製；確認遷移完成後可移除這行與下方宣告
      - catan-data:/data-legacy:ro
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  katan-data:
  catan-data:
