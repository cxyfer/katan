# Runs the published image (ghcr.io/cxyfer/katan). To build from this checkout,
# add docker-compose.build.yml (see docs/OPERATIONS.md).
services:
  katan:
    image: ghcr.io/cxyfer/katan:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://katan:${POSTGRES_PASSWORD:-katan}@postgres:5432/katan
      WEB_DIST_PATH: /app/web
      COOKIE_SECURE: "false" # set to true behind TLS
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: katan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katan}
      POSTGRES_DB: katan
    volumes:
      - katan-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katan -d katan"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  katan-postgres:
