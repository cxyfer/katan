name: Docker image

# Built only when a release tag (including -rc.N) is pushed; pull requests and
# merges to the default branch never build, to save Actions minutes and GHCR
# storage. One build per tag, pushed by digest. The smoke test runs the pushed
# digest, and the release tags are only ever moved onto a digest that passed
# that test, so a published tag cannot describe a different build than the one
# that was verified.
on:
  push:
    tags: ["v*"]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push by digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # A tag is a promise about the contents of the commit it points at: the
      # bundle is stamped from package.json, so a mismatch publishes an image
      # labelled with a version it does not contain.
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=package.json::tag $GITHUB_REF_NAME does not match the package.json version $version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json $version"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Only the immutable commit tag is pushed here; release tags are applied
      # later, by digest, once the smoke test has run.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # Both platforms on every event: arm64 is smoke tested below and the
          # publish job only retags what that test actually pulled.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  smoke:
    name: Smoke test digest (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            depth: full
          - platform: linux/arm64
            depth: basic
    steps:
      - uses: actions/checkout@v7

      # arm64 runs under emulation on an amd64 runner.
      - uses: docker/setup-qemu-action@v4
        if: matrix.platform != 'linux/amd64'

      - uses: actions/setup-node@v7
        if: matrix.depth == 'full'
        with:
          node-version: "22"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Pulled by digest: this is byte-for-byte the image the publish job
      # retags, not a local rebuild.
      - name: Start the pushed digest
        run: |
          set -euo pipefail
          docker run --detach --name catan-smoke --platform ${{ matrix.platform }} \
            --publish 3411:3000 \
            --env COOKIE_SECURE=false --env LOG_LEVEL=warn \
            "${{ env.IMAGE }}@${{ needs.build.outputs.digest }}"
          for _ in $(seq 1 90); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:3411/healthz || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy; logs follow" >&2
          docker logs catan-smoke >&2
          exit 1

      - name: Readiness probe
        run: |
          set -euo pipefail
          curl --silent --fail http://127.0.0.1:3411/healthz
          curl --silent --fail http://127.0.0.1:3411/readyz

      # The image must report the version of the commit it was built from; this
      # is what catches a build-time stamp that silently stopped working.
      - name: Image reports the package version
        if: matrix.depth == 'full'
        run: |
          set -euo pipefail
          expected="$(node -p "require('./package.json').version")"
          actual="$(curl --silent --fail http://127.0.0.1:3411/healthz | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              process.stdout.write(String(JSON.parse(body).data.version));
            });
          ')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::/healthz reports '$actual' but package.json declares '$expected'"
            exit 1
          fi
          echo "/healthz reports $actual"

      - name: Smoke test the running image
        if: matrix.depth == 'full'
        run: SMOKE_BASE_URL=http://127.0.0.1:3411 node scripts/smoke.mjs

      - name: Container logs
        if: failure()
        run: docker logs catan-smoke || true

      - name: Stop container
        if: always()
        run: docker rm --force catan-smoke || true

  publish:
    name: Promote tested digest
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `latest` only moves for a stable version; a `-rc.N` tag would otherwise
      # hand players an image stamped with a pre-release version.
      - uses: actions/checkout@v7

      - name: Read the version on this commit
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME carries $version (prerelease=$prerelease)"

      # `latest` and the moving `X.Y` tag only move on stable v* tags; a
      # pre-release tag keeps just its exact version tag. Every build also keeps
      # its immutable sha-<short> tag for rollback.
      - name: Release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}

      - name: Retag the tested digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no release tag resolved for this ref" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Tested digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
