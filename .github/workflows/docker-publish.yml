name: Docker image

# Builds the image on every pull request, and publishes it to GitHub Container
# Registry on master and on v* tags. The published image is the artefact that
# passed the container smoke test, not a raw rebuild.
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    name: Build and smoke test (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Loaded locally so the container test exercises exactly what ships.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: catan:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Start container and wait for /healthz
        run: |
          set -euo pipefail
          docker run --detach --name catan-ci --publish 3411:3000 \
            --env COOKIE_SECURE=false --env LOG_LEVEL=warn catan:ci
          for _ in $(seq 1 60); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:3411/healthz || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy; logs follow" >&2
          docker logs catan-ci >&2
          exit 1

      - name: Readiness probe
        run: |
          set -euo pipefail
          curl --silent --fail http://127.0.0.1:3411/healthz
          curl --silent --fail http://127.0.0.1:3411/readyz

      - name: Smoke test the running image
        run: SMOKE_BASE_URL=http://127.0.0.1:3411 node scripts/smoke.mjs

      - name: Container logs
        if: failure()
        run: docker logs catan-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force catan-ci || true

  publish:
    name: Publish to GHCR
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # latest only moves on the default branch and on v* tags; every build also
      # gets an immutable sha-<short> tag for rollback.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=katan
            org.opencontainers.image.description=Server-authoritative browser trading game

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
