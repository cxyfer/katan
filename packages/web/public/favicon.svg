    <use href="#tile" transform="translate(0 17.3) rotate(-30)" fill="#afc786" />
    <use href="#tile" transform="translate(-15 8.66) rotate(-30)" fill="#d6bb72" />
    <use href="#tile" transform="translate(-15 -8.66) rotate(-30)" fill="#6f8c5e" />
  </g>
  <path d="M-5 3.5v-4l5-4 5 4v4Z" fill="#c8553d" stroke="#3b2418" stroke-width="1.2" stroke-linejoin="round" />
